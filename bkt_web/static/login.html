<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Đăng nhập · TokMatrix</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.10.0/dist/css/adminlte.min.css">
  <link rel="stylesheet" href="/static/admin/css/app.css?v=1">
  <script>
    try { var t = localStorage.getItem('tm-theme'); } catch (e) {}
    document.documentElement.setAttribute('data-bs-theme', t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  </script>
</head>
<body class="login-page bg-body-secondary">
  <div class="login-box">
    <div class="card card-outline card-primary">
      <div class="card-header text-center">
        <span class="brand-mark"><i class="bi bi-lightning-charge-fill"></i></span><span class="h4 fw-semibold align-middle">TokMatrix</span>
      </div>
      <div class="card-body login-card-body">
        <p class="login-box-msg">Đăng nhập để vào bảng quản trị</p>
        <div class="alert alert-danger d-none py-2 small" id="msg" role="alert"></div>
        <form id="form" autocomplete="on">
          <div class="input-group mb-3">
            <input class="form-control" id="username" name="username" type="text" autocomplete="username" placeholder="Tên đăng nhập" required autofocus>
            <span class="input-group-text"><i class="bi bi-person"></i></span>
          </div>
          <div class="input-group mb-3">
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" placeholder="Mật khẩu" required>
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
          </div>
          <button type="submit" class="btn btn-primary w-100" id="submit">Đăng nhập</button>
        </form>
        <p class="small text-body-secondary text-center mt-3 mb-0">Phiên đăng nhập có hiệu lực 14 ngày</p>
      </div>
    </div>
  </div>
<script>
(function () {
  var form = document.getElementById('form');
  var msg = document.getElementById('msg');
  var btn = document.getElementById('submit');

  function fail(text) {
    msg.textContent = text;
    msg.classList.remove('d-none');
    btn.disabled = false;
    btn.textContent = 'Đăng nhập';
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    msg.classList.add('d-none');
    btn.disabled = true;
    btn.textContent = 'Đang kiểm tra…';
    try {
      var res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: form.username.value, password: form.password.value })
      });
      var data = await res.json().catch(function () { return {}; });
      if (res.ok && data.success) {
        // Quay lại đúng trang (kể cả #/trang) người dùng định vào trước khi bị chặn.
        var next = new URLSearchParams(location.search).get('next') || '/';
        if (next.charAt(0) !== '/' || next.charAt(1) === '/') next = '/';
        location.replace(next);
        return;
      }
      fail(data.detail || 'Đăng nhập thất bại.');
    } catch (err) {
      fail('Không kết nối được tới máy chủ.');
    }
  });
})();
</script>
</body>
</html>
