<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TokMatrix Admin</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.10.0/dist/css/adminlte.min.css">
  <link rel="stylesheet" href="/static/admin/css/app.css?v=5">
  <link rel="stylesheet" href="/static/admin/css/flow_view.css?v=1">
  <link rel="stylesheet" href="/static/admin/css/legacy.css?v=1">
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
  <div class="app-wrapper">
    <nav class="app-header navbar navbar-expand bg-body">
      <div class="container-fluid">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button" aria-label="Thu gọn menu"><i class="bi bi-list"></i></a>
          </li>
          <li class="nav-item d-none d-md-block"><span class="nav-link fw-semibold" id="hdr-title">TokMatrix</span></li>
        </ul>
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item d-none d-sm-block"><span class="nav-link small text-body-secondary" id="hdr-clock"></span></li>
          <li class="nav-item">
            <a class="nav-link" href="#" id="theme-toggle" role="button" title="Đổi giao diện sáng/tối"><i class="bi bi-moon-stars"></i></a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#" id="hdr-user"><i class="bi bi-person-circle me-1"></i><span>Tài khoản</span></a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="#/settings"><i class="bi bi-gear me-2"></i>Cài đặt</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item text-danger" href="#" id="btn-logout"><i class="bi bi-box-arrow-right me-2"></i>Đăng xuất</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </nav>

    <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
      <div class="sidebar-brand">
        <a href="#/dashboard" class="brand-link">
          <span class="brand-mark"><i class="bi bi-lightning-charge-fill"></i></span>
          <span class="brand-text fw-semibold">TokMatrix</span>
        </a>
      </div>
      <div class="sidebar-wrapper">
        <nav class="mt-2">
          <ul class="nav sidebar-menu flex-column" role="menu" id="side-menu"></ul>
        </nav>
      </div>
    </aside>

    <main class="app-main">
      <div class="app-content-header">
        <div class="container-fluid">
          <div class="row align-items-center">
            <div class="col-sm-7"><h3 class="mb-0" id="page-title"></h3><div class="small text-body-secondary" id="page-desc"></div></div>
            <div class="col-sm-5">
              <ol class="breadcrumb float-sm-end mb-0" id="page-crumbs"></ol>
            </div>
          </div>
        </div>
      </div>
      <div class="app-content">
        <div class="container-fluid" id="page"></div>
      </div>
    </main>

    <footer class="app-footer small">
      <span class="text-body-secondary">TokMatrix · bảng quản trị</span>
      <span class="float-end d-none d-sm-inline text-body-secondary" id="ftr-status"></span>
    </footer>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/admin-lte@4.10.0/dist/js/adminlte.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="/static/admin/js/core.js?v=1"></script>
  <script src="/static/admin/js/pages/dashboard.js?v=2"></script>
  <script src="/static/admin/js/pages/channels.js?v=1"></script>
  <script src="/static/admin/js/pages/stats.js?v=1"></script>
  <script src="/static/admin/js/pages/profiles.js?v=1"></script>
  <script src="/static/admin/js/pages/network.js?v=2"></script>
  <script src="/static/admin/js/legacy_studio.js?v=3"></script>
  <script src="/static/admin/js/pages/studio.js?v=3"></script>
  <script src="/static/admin/js/pages/story_remake.js?v=2"></script>
  <script src="/static/admin/js/pages/muse.js?v=1"></script>
  <script src="/static/admin/js/pages/dola.js?v=1"></script>
  <script src="/static/admin/js/pages/remake.js?v=1"></script>
  <script src="/static/admin/js/pages/ai_images.js?v=1"></script>
  <script src="/static/admin/js/pages/bridge.js?v=1"></script>
  <script src="/static/admin/js/pages/media.js?v=1"></script>
  <script src="/static/admin/js/pages/upload.js?v=3"></script>
  <script src="/static/admin/js/pages/autopilot.js?v=1"></script>
  <script src="/static/admin/js/flow_canvas.js?v=1"></script>
  <script src="/static/admin/js/pages/flow.js?v=2"></script>
  <script src="/static/admin/js/pages/settings.js?v=1"></script>
  <script src="/static/admin/js/pages/workers.js?v=1"></script>
  <script src="/static/admin/js/app.js?v=1"></script>
</body>
</html>
