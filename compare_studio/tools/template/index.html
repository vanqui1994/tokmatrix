    <style>
      /* Be Vietnam Pro / JetBrains Mono, embedded directly (not a Google Fonts <link>)
         so the "vietnamese" unicode-range subset — precomposed tone-mark glyphs like
         ệ, ẫ, ổ (U+1EA0-1EF9) — loads correctly. The compiler's pre-bundled embed for
         these families only covers "latin", which drops Vietnamese diacritics. */
      @font-face {
        font-family: "Be Vietnam Pro";
        font-style: normal;
        font-weight: 900;
        font-display: swap;
        src: url(https://fonts.gstatic.com/s/bevietnampro/v12/QdVMSTAyLFyeg_IDWvOJmVES_HS0Im86Rb0bcw.woff2) format("woff2");
        unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
      }
      @font-face {
        font-family: "Be Vietnam Pro";
        font-style: normal;
        font-weight: 900;
        font-display: swap;
        src: url(https://fonts.gstatic.com/s/bevietnampro/v12/QdVMSTAyLFyeg_IDWvOJmVES_HS0Im81Rb0.woff2) format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url(https://fonts.gstatic.com/s/jetbrainsmono/v24/tDbY2o-flEEny0FZhsfKu5WU4zr3E_BX0PnT8RD8L6tTNVOVgaY.woff2) format("woff2");
        unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url(https://fonts.gstatic.com/s/jetbrainsmono/v24/tDbY2o-flEEny0FZhsfKu5WU4zr3E_BX0PnT8RD8L6tTOlOV.woff2) format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
    <style>
      :root {
{{THEME_PALETTE}}
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg);
        font-family: "Be Vietnam Pro", sans-serif;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg);
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* ---------- background decoratives ---------- */
      .glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        pointer-events: none;
      }
      #glow-top {
        width: 560px;
        height: 560px;
        left: 260px;
        top: 120px;
        background: radial-gradient(circle, var(--glow-top, rgba(204, 107, 73, 0.35)) 0%, transparent 70%);
      }
      #glow-bottom {
        width: 640px;
        height: 640px;
        left: 220px;
        top: 1085px;
        background: radial-gradient(circle, var(--glow-bottom, rgba(115, 189, 168, 0.35)) 0%, transparent 70%);
      }

      /* ---------- top comparison zone (y 64-824) ---------- */
      .card {
        position: absolute;
        top: 275px;
        width: 450px;
        height: 450px;
        border-radius: 32px;
        background: var(--panel);
        /* Viền dày 3px vì timeline tô sáng nó cho thẻ đang được nói tới.
           box-sizing giữ thẻ đúng kích thước dù viền đổi. */
        border: 3px solid var(--panel-edge-dim, rgba(210, 162, 76, 0.22));
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 22px 22px 20px;
        transform-origin: 50% 50%;
        will-change: transform, opacity, border-color;
      }
      #card-left {
        left: 70px;
      }
      #card-right {
        left: 560px;
      }
      .card-icon {
        position: relative;
        width: 100%;
        height: 345px;
        border-radius: 22px;
        display: grid;
        place-items: center;
      }
      .card-label {
        margin-top: auto;
        font-weight: 900;
        font-size: 46px;
        color: var(--fg-on-panel);
        text-transform: uppercase;
        letter-spacing: 0.01em;
        text-align: center;
        padding: 0 16px;
      }
      /* card icon slot — generic.
         Nhận cả <svg> inline lẫn <img> (ảnh người dùng tự upload): cùng class
         .icon-art, object-fit contain nên tỉ lệ nào cũng vừa khung, không méo. */
      /* Một nền duy nhất cho cả hai thẻ: trước đây mỗi bên một gradient khác
         nhau nên thẻ trái luôn trông tối hơn thẻ phải dù cùng trạng thái. */
      .icon-panel {
        position: absolute;
        inset: 0;
        border-radius: 22px;
        background: linear-gradient(180deg, #5f4a38 0%, #6f5643 100%);
      }
      .icon-art {
        position: relative;
        display: block;
        /* Kích thước phải tường minh: <svg> chỉ có viewBox mà để width/height auto
           thì co về 0 trong grid container. Với svg, preserveAspectRatio mặc định
           lo phần tỉ lệ; với <img> thì object-fit: contain lo. */
        width: 305px;
        height: 305px;
        object-fit: contain;
      }
      img.icon-art {
        width: 315px;
        height: 315px;
        object-fit: cover;
        border-radius: 20px;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
      }

      /* VS badge */
      #vs-badge {
        position: absolute;
        top: 440px;
        left: 480px;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: var(--accent-terra-ink);
        display: grid;
        place-items: center;
        box-shadow: 0 8px 24px rgba(111, 86, 67, 0.28);
        z-index: 5;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }
      #vs-badge span {
        font-weight: 900;
        font-size: 38px;
        color: var(--bg);
        letter-spacing: 0.02em;
      }


      /* ---------- middle caption zone (y 840-1300) ---------- */
      #eyebrow {
        position: absolute;
        top: 838px;
        left: 110px;
        width: 860px;
        text-align: center;
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 0.14em;
        color: var(--fg-dim);
        opacity: 0;
      }
      #caption-zone {
        position: absolute;
        top: 900px;
        left: 110px;
        width: 860px;
        height: 340px;
      }
      .caption-line {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
      }
      /* A single wrapper element around each line's mixed text + .kw spans —
         .caption-line itself must not be the flex container of that mixed
         content, or the browser splits the bare text runs and the .kw span
         into separate anonymous flex items that each wrap independently
         (rendering as broken side-by-side columns instead of one paragraph). */
      .caption-line-text {
        display: inline-block;
        max-width: 100%;
        text-align: center;
        font-weight: 900;
        font-size: 60px;
        line-height: 1.22;
        color: var(--fg);
      }
      .kw {
        display: inline-block;
        color: var(--accent-terra-ink);
        transform-origin: 50% 50%;
        margin: 0 8px;
      }

      /* ---------- bottom avatar zone (y 1280-1920) ---------- */
{{MASCOT_CSS}}
    </style>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---------- entrance (0.0 - 0.75s) ----------
      tl.fromTo("#card-left", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.0);
      tl.fromTo("#card-right", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.15);
      tl.fromTo("#vs-badge", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.45);
      tl.fromTo("#avatar-host", { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.fromTo("#eyebrow", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.15);

      // ---------- caption line helper ----------
      // Pops a line in (spring-pop, y+fade) at the same moment its VO clip starts,
      // holds through the real speech duration + a short buffer, exits fast
      // (fade+lift). Pass outAt=null to hold the line with no exit (final line).
      // Keyword spans get a quick color-set + scale punch timed to the line landing.
      function showLine(id, inAt, outAt) {
        tl.fromTo(id, { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, inAt);
        if (outAt != null) {
          tl.to(id, { y: -16, opacity: 0, duration: 0.2, ease: "power2.in" }, outAt);
        }
        const kws = document.querySelectorAll(id + " .kw");
        kws.forEach((el, i) => {
          tl.fromTo(
            el,
            { scale: 1 },
            { scale: 1.15, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 },
            inAt + 0.2 + i * 0.08,
          );
        });
      }

      // ---------- avatar pose helper ----------
      // power3.out discrete rotation tween per gesture; targets are hand-authored angles.
      function pose(leftDeg, rightDeg, at, dur) {
        tl.to("#arm-left", { rotation: leftDeg, duration: dur, ease: "power3.out" }, at);
        tl.to("#arm-right", { rotation: rightDeg, duration: dur, ease: "power3.out" }, at);
      }
      function headTilt(deg, at, dur) {
        tl.to("#avatar-head", { rotation: deg, duration: dur, ease: "power3.out" }, at);
      }
      // finite "talking" mouth wiggle across a speaking window
      function talk(startAt, endAt) {
        const cycle = 0.22;
        const reps = Math.max(0, Math.floor((endAt - startAt) / cycle) - 1);
        tl.to(
          "#mouth",
          { scaleY: 0.4, duration: cycle / 2, ease: "power1.inOut", yoyo: true, repeat: reps },
          startAt,
        );
        tl.set("#mouth", { scaleY: 1 }, endAt);
      }

      // Arm geometry note: both arm divs hang straight down at rotation:0 (identical
      // local coordinates), so they are NOT mirrored automatically. A POSITIVE rotation
      // swings the LEFT arm outward-left; a NEGATIVE rotation swings the RIGHT arm
      // outward-right. Always pass opposite-signed magnitudes for a mirrored pose.

      // ---------- VO-driven beat timing ----------
      // Real Edge TTS clip durations (assets/vo/durations.json) drive every beat —
      // caption pop-in, avatar pose, and the mouth-talk window all key off each
      // clip's actual [start, start+duration], not an estimate.
{{VO}}
      const capOut = (n) => VO[n].start + VO[n].dur + 0.25;

      const totalLines = Object.keys(VO).length;
      const rootStyle = getComputedStyle(document.documentElement);
      const edgeColor = rootStyle.getPropertyValue("--panel-edge").trim() || "#D2A24C";
      const edgeDim = rootStyle.getPropertyValue("--panel-edge-dim").trim() || "rgba(210, 162, 76, 0.22)";

      if (totalLines >= 18) {
        // =========================================================================
        // 🎬 7-ACT CINEMATIC DIRECTOR TREATMENT (65s - 70s · 20 BEATS)
        // =========================================================================

        // ---------- ACT 1: HOOK (Line 1 - 2) ----------
        pose(115, -8, VO[1].start, 0.3);
        showLine("#line-1", VO[1].start, capOut(1));
        talk(VO[1].start, VO[1].start + VO[1].dur);

        pose(8, -115, VO[2].start, 0.3);
        showLine("#line-2", VO[2].start, capOut(2));
        talk(VO[2].start, VO[2].start + VO[2].dur);

        // ---------- ACT 2: MYSTERY & STAKES (Line 3 - 4) ----------
        pose(55, -55, VO[3].start, 0.35);
        headTilt(6, VO[3].start, 0.35);
        showLine("#line-3", VO[3].start, capOut(3));
        talk(VO[3].start, VO[3].start + VO[3].dur);

        headTilt(-4, VO[4].start, 0.3);
        showLine("#line-4", VO[4].start, capOut(4));
        talk(VO[4].start, VO[4].start + VO[4].dur);
        headTilt(0, capOut(4), 0.3);

        // ---------- ACT 3: DEEP DIVE SIDE A (Line 5 - 8) ----------
        // Spotlight zoom-in on Card A (1.08), Card B steps back (0.92, opacity 0.6)
        tl.to("#card-left", { scale: 1.08, borderColor: edgeColor, opacity: 1, duration: 0.45, ease: "power2.out" }, VO[5].start);
        tl.to("#card-right", { scale: 0.92, borderColor: edgeDim, opacity: 0.6, duration: 0.45, ease: "power2.out" }, VO[5].start);
        pose(85, -8, VO[5].start, 0.3);

        showLine("#line-5", VO[5].start, capOut(5));
        talk(VO[5].start, VO[5].start + VO[5].dur);

        showLine("#line-6", VO[6].start, capOut(6));
        talk(VO[6].start, VO[6].start + VO[6].dur);

        showLine("#line-7", VO[7].start, capOut(7));
        talk(VO[7].start, VO[7].start + VO[7].dur);

        showLine("#line-8", VO[8].start, capOut(8));
        talk(VO[8].start, VO[8].start + VO[8].dur);

        // ---------- ACT 4: THE BRIDGE / TURNING POINT (Line 9) ----------
        pose(45, -45, VO[9].start, 0.35);
        headTilt(5, VO[9].start, 0.3);
        tl.to("#card-left", { scale: 1.0, borderColor: edgeDim, opacity: 0.85, duration: 0.4, ease: "power2.inOut" }, VO[9].start);
        tl.to("#card-right", { scale: 1.0, borderColor: edgeDim, opacity: 0.85, duration: 0.4, ease: "power2.inOut" }, VO[9].start);
        showLine("#line-9", VO[9].start, capOut(9));
        talk(VO[9].start, VO[9].start + VO[9].dur);
        headTilt(0, capOut(9), 0.3);

        // ---------- ACT 5: DEEP DIVE SIDE B (Line 10 - 13) ----------
        // Spotlight zoom-in on Card B (1.08), Card A steps back (0.92, opacity 0.6)
        tl.to("#card-left", { scale: 0.92, borderColor: edgeDim, opacity: 0.6, duration: 0.45, ease: "power2.out" }, VO[10].start);
        tl.to("#card-right", { scale: 1.08, borderColor: edgeColor, opacity: 1, duration: 0.45, ease: "power2.out" }, VO[10].start);
        pose(8, -85, VO[10].start, 0.3);

        showLine("#line-10", VO[10].start, capOut(10));
        talk(VO[10].start, VO[10].start + VO[10].dur);

        showLine("#line-11", VO[11].start, capOut(11));
        talk(VO[11].start, VO[11].start + VO[11].dur);

        showLine("#line-12", VO[12].start, capOut(12));
        talk(VO[12].start, VO[12].start + VO[12].dur);

        showLine("#line-13", VO[13].start, capOut(13));
        talk(VO[13].start, VO[13].start + VO[13].dur);

        // ---------- ACT 6: SHOWDOWN MATRIX 3 ROUNDS (Line 14 - 17) ----------
        tl.to("#card-left", { scale: 1.0, borderColor: edgeDim, opacity: 1, duration: 0.4, ease: "power2.out" }, VO[14].start);
        tl.to("#card-right", { scale: 1.0, borderColor: edgeDim, opacity: 1, duration: 0.4, ease: "power2.out" }, VO[14].start);
        pose(55, -55, VO[14].start, 0.3);

        // Round 1 (Card A punch)
        tl.fromTo("#card-left", { scale: 1 }, { scale: 1.06, borderColor: edgeColor, duration: 0.28, ease: "power2.out", yoyo: true, repeat: 1 }, VO[14].start + 0.1);
        showLine("#line-14", VO[14].start, capOut(14));
        talk(VO[14].start, VO[14].start + VO[14].dur);

        // Round 2 (Card B punch)
        tl.fromTo("#card-right", { scale: 1 }, { scale: 1.06, borderColor: edgeColor, duration: 0.28, ease: "power2.out", yoyo: true, repeat: 1 }, VO[15].start + 0.1);
        showLine("#line-15", VO[15].start, capOut(15));
        talk(VO[15].start, VO[15].start + VO[15].dur);

        // Round 3 (Clash)
        tl.fromTo("#card-left", { x: 0 }, { x: 8, duration: 0.12, ease: "power1.inOut", yoyo: true, repeat: 2 }, VO[16].start + 0.1);
        tl.fromTo("#card-right", { x: 0 }, { x: -8, duration: 0.12, ease: "power1.inOut", yoyo: true, repeat: 2 }, VO[16].start + 0.1);
        showLine("#line-16", VO[16].start, capOut(16));
        talk(VO[16].start, VO[16].start + VO[16].dur);

        // Summary
        showLine("#line-17", VO[17].start, capOut(17));
        talk(VO[17].start, VO[17].start + VO[17].dur);

        // ---------- ACT 7: THE CLIMAX, GOLDEN RULE & CTA (Line 18 - 20) ----------
        // Line 18: Golden Mnemonic Rule
        pose(70, -70, VO[18].start, 0.3);
        showLine("#line-18", VO[18].start, capOut(18));
        talk(VO[18].start, VO[18].start + VO[18].dur);

        // Line 19: Payoff Verdict
        tl.to("#card-left", { scale: 1.04, borderColor: edgeColor, opacity: 1, duration: 0.4, ease: "power2.out" }, VO[19].start);
        tl.to("#card-right", { scale: 1.04, borderColor: edgeColor, opacity: 1, duration: 0.4, ease: "power2.out" }, VO[19].start);
        pose(115, -115, VO[19].start, 0.35);
        tl.fromTo("#avatar-body", { scale: 1 }, { scale: 1.05, duration: 0.3, ease: "power2.out", yoyo: true, repeat: 1 }, VO[19].start);
        showLine("#line-19", VO[19].start, totalLines >= 20 ? capOut(19) : null);
        talk(VO[19].start, VO[19].start + VO[19].dur);

        // Line 20: Viral Engagement CTA (holds to end of video)
        if (totalLines >= 20) {
          pose(15, -15, VO[20].start, 0.3);
          showLine("#line-20", VO[20].start, null);
          talk(VO[20].start, VO[20].start + VO[20].dur);
        }
      } else {
        // =========================================================================
        // 📼 12-LINE LEGACY TIMELINE (30s - 40s)
        // =========================================================================

        // ---------- BEAT 1: HOOK (line 1-2) ----------
        pose(115, -8, VO[1].start, 0.3);
        showLine("#line-1", VO[1].start, capOut(1));
        talk(VO[1].start, VO[1].start + VO[1].dur);

        pose(8, -115, VO[2].start, 0.3);
        showLine("#line-2", VO[2].start, capOut(2));
        talk(VO[2].start, VO[2].start + VO[2].dur);

        // ---------- BEAT 2: NÚT THẮT (line 3) ----------
        pose(55, -55, VO[3].start, 0.35);
        headTilt(6, VO[3].start, 0.35);
        showLine("#line-3", VO[3].start, capOut(3));
        talk(VO[3].start, VO[3].start + VO[3].dur);
        headTilt(0, capOut(3), 0.3);

        // ---------- BEAT 3: SIDE A — line 4-5-6 ----------
        tl.to("#card-left", { scale: 1.05, borderColor: edgeColor, opacity: 1, duration: 0.4, ease: "power2.out" }, VO[4].start);
        tl.to("#card-right", { scale: 0.96, borderColor: edgeDim, opacity: 0.85, duration: 0.4, ease: "power2.out" }, VO[4].start);
        pose(75, -8, VO[4].start, 0.3);
        showLine("#line-4", VO[4].start, capOut(4));
        talk(VO[4].start, VO[4].start + VO[4].dur);
        showLine("#line-5", VO[5].start, capOut(5));
        talk(VO[5].start, VO[5].start + VO[5].dur);
        showLine("#line-6", VO[6].start, capOut(6));
        talk(VO[6].start, VO[6].start + VO[6].dur);

        // ---------- BEAT 4: SIDE B — line 7-8-9 ----------
        tl.to("#card-left", { scale: 0.96, borderColor: edgeDim, opacity: 0.85, duration: 0.4, ease: "power2.out" }, VO[7].start);
        tl.to("#card-right", { scale: 1.05, borderColor: edgeColor, opacity: 1, duration: 0.4, ease: "power2.out" }, VO[7].start);
        pose(8, -75, VO[7].start, 0.3);
        showLine("#line-7", VO[7].start, capOut(7));
        talk(VO[7].start, VO[7].start + VO[7].dur);
        showLine("#line-8", VO[8].start, capOut(8));
        talk(VO[8].start, VO[8].start + VO[8].dur);
        showLine("#line-9", VO[9].start, capOut(9));
        talk(VO[9].start, VO[9].start + VO[9].dur);

        // ---------- BEAT 5: SO SÁNH TRỰC TIẾP (line 10-11) ----------
        tl.to("#card-left", { scale: 1, borderColor: edgeDim, opacity: 1, duration: 0.4, ease: "power2.out" }, VO[10].start);
        tl.to("#card-right", { scale: 1, borderColor: edgeDim, opacity: 1, duration: 0.4, ease: "power2.out" }, VO[10].start);
        pose(55, -55, VO[10].start, 0.3);
        tl.fromTo("#card-left", { scale: 1 }, { scale: 1.03, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, VO[10].start + 0.1);
        showLine("#line-10", VO[10].start, capOut(10));
        talk(VO[10].start, VO[10].start + VO[10].dur);
        tl.fromTo("#card-right", { scale: 1 }, { scale: 1.03, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, VO[11].start + 0.1);
        showLine("#line-11", VO[11].start, capOut(11));
        talk(VO[11].start, VO[11].start + VO[11].dur);

        // ---------- BEAT 6: PAYOFF (line 12) ----------
        tl.to("#card-left", { scale: 1, borderColor: edgeColor, opacity: 1, duration: 0.4, ease: "power2.out" }, VO[12].start);
        tl.to("#card-right", { scale: 1, borderColor: edgeColor, opacity: 1, duration: 0.4, ease: "power2.out" }, VO[12].start);
        pose(8, -8, VO[12].start, 0.3);
        tl.fromTo(
          "#avatar-body",
          { scale: 1 },
          { scale: 1.04, duration: 0.3, ease: "power2.out", yoyo: true, repeat: 1 },
          VO[12].start,
        );
        showLine("#line-12", VO[12].start, null);
        talk(VO[12].start, VO[12].start + VO[12].dur);
      }

      // ---------- ambient background glows (finite, phase-opposed) ----------
      const ROOT_DURATION = {{ROOT}};
      const glowCycle = 3.2;
      const glowReps = Math.max(0, Math.floor(ROOT_DURATION / glowCycle) - 1);
      tl.fromTo(
        "#glow-top",
        { opacity: 0.6 },
        { opacity: 1, duration: glowCycle / 2, ease: "sine.inOut", yoyo: true, repeat: glowReps },
        0,
      );
      tl.fromTo(
        "#glow-bottom",
        { opacity: 1 },
        { opacity: 0.6, duration: glowCycle / 2, ease: "sine.inOut", yoyo: true, repeat: glowReps },
        0,
      );

      window.__timelines["main"] = tl;
    </script>
